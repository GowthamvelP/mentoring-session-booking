name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RAILS_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mentoring_test
  REDIS_URL: redis://localhost:6379/0

jobs:
  # ============================================
  # Backend: Lint + Security + Tests + Coverage
  # ============================================
  backend-lint:
    name: "Backend: Lint & Static Analysis"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: backend
      - name: RuboCop
        run: bundle exec rubocop --format github
      - name: Brakeman (Security)
        run: bundle exec brakeman --no-pager --format sarif --output brakeman.sarif || true
      - name: Upload Brakeman SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/brakeman.sarif
          category: brakeman

  backend-security:
    name: "Backend: Dependency Audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: backend
      - name: Bundle Audit
        run: bundle exec bundler-audit check --update

  backend-tests:
    name: "Backend: RSpec Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mentoring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: backend
      - name: Setup database
        run: bin/rails db:prepare
      - name: Run RSpec
        run: bundle exec rspec --format documentation --format json --out rspec-results.json
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
      - name: Check coverage threshold
        run: |
          COVERAGE=$(ruby -e "require 'json'; data = JSON.parse(File.read('coverage/.last_run.json')); puts data['result']['line']")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below 90% threshold"
            exit 1
          fi

  # ============================================
  # Frontend: Lint + Type Check + Tests
  # ============================================
  frontend-checks:
    name: "Frontend: TypeScript + Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Build (verify production build works)
        run: npm run build

  # ============================================
  # Docker: Verify compose builds
  # ============================================
  docker-build:
    name: "Docker: Verify Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all containers
        run: docker compose build
      - name: Verify compose config
        run: docker compose config --quiet
